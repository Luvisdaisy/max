[project]
name = "max-gui"
version = "0.1.0"
description = "本地多模态 ReAct GUI Agent CLI"
readme = "README.md"
authors = [
    { name = "haotiantzz", email = "haotiantzz@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.0.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langgraph>=0.3.0",
    "pillow>=11.0.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.10.0",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.3",
    "peft>=0.14.0",
    "textual>=2.0.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.57.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
max-gui = "max_gui:main"
max = "max_gui:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [
    ".venv",
    "artifacts",
    "model",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
