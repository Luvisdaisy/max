[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "max-desktop-agent"
version = "0.1.0"
description = "Safe, reproducible Windows desktop-agent prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain==1.3.14",
  "langgraph==1.2.10",
  "modelscope==1.39.1",
  "textual==8.1.1",
  "transformers==5.14.1",
]

[project.scripts]
max-agent = "max_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["F", "I"]
